name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release version
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - name: Verify and package plugin
        run: npm run artifact

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-disky-plugin-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
              --verify-tag \
              --generate-notes \
              --title "Komari Disky Plugin $GITHUB_REF_NAME"
          fi
